  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function idioma(c) {
    var i = L.indexOf(c);
    if (i < 0) { i = 0; c = L[0]; }
    document.documentElement.lang = c;
    document.documentElement.dir = c === "ar" ? "rtl" : "ltr";
    var els = document.querySelectorAll("[data-i]");
    for (var n = 0; n < els.length; n++) {
      var k = els[n].getAttribute("data-i");
      if (T[k]) els[n].textContent = T[k][i];
    }
    document.getElementById("sel").value = c;
    guardar("radix_site_lang", c);
  }

  function detectar() {
    var s = ler("radix_site_lang");
    if (s && L.indexOf(s) >= 0) return s;
    var nav = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "pt-BR"]);
    for (var n = 0; n < nav.length; n++) {
      var p = String(nav[n]).toLowerCase().split("-")[0];
      for (var j = 0; j < L.length; j++) if (L[j].toLowerCase().split("-")[0] === p) return L[j];
    }
    return "pt-BR";
  }

  function zoom(v) {
    document.documentElement.style.fontSize = v + "%";
    var z = document.getElementById("zoom");
    z.value = v; z.setAttribute("aria-valuetext", v + "%");
    document.getElementById("zout").textContent = v + "%";
    guardar("radix_site_zoom", v);
  }

  document.getElementById("sel").addEventListener("change", function (e) { idioma(e.target.value); });
  document.getElementById("zoom").addEventListener("input", function (e) { zoom(parseInt(e.target.value, 10)); });
  idioma(detectar());
  var z0 = parseInt(ler("radix_site_zoom") || "100", 10);
  zoom(z0 >= 100 && z0 <= 200 ? z0 : 100);
})();
